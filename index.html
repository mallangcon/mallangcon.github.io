<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말랑콘 쇼핑 링크</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 친근한 육아맘 핫딜 친구, 가볍고 빠르게
   IDEA: 영상 속 번호표를 그대로 누르는 사탕 가게 진열대
   PICTURE: 말랑콘 유니콘과 큰 번호 버튼 목록
   COLOUR/TYPE: 파스텔 하늘·분홍 바탕, 진한 남색 글자, 코랄 할인 / Jua 제목 + Gowun Dodum 본문
   LAYOUT: 한 줄 세로 목록, 휴대폰 우선 */
:root{color-scheme:light dark;--bg:light-dark(#fdf3f8,#1b1830);--card:light-dark(#ffffff,#26223f);--ink:light-dark(#252a4a,#f3f1ff);--dim:light-dark(#6b6f8e,#b6b2d6);--line:light-dark(#efe3ee,#37315a);--accent:#ff6f61;--num:light-dark(#252a4a,#f3f1ff);--numink:light-dark(#fff,#1b1830)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip;word-break:keep-all}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 15% 0%,light-dark(#d9ecff,#2a3466) 0,transparent 70%),radial-gradient(50% 40% at 100% 10%,light-dark(#ffd9ea,#4a2a55) 0,transparent 70%),radial-gradient(60% 40% at 50% 100%,light-dark(#fff1c9,#2d2a4a) 0,transparent 70%)}
main{max-width:520px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;gap:14px;padding:8px 0 6px}
header img{width:96px;height:96px;flex:none;filter:drop-shadow(0 6px 10px rgba(80,60,120,.2))}
h1{font:400 32px/1.05 Jua,sans-serif;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--dim)}
.ad{margin:14px 0;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--dim)}
.find{display:flex;gap:8px;margin:0 0 14px}
.find input{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px "Gowun Dodum",sans-serif;padding:0 14px}
.find input:focus-visible,a.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:10px}
a.item{display:grid;grid-template-columns:52px 64px minmax(0,1fr) 20px;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;box-shadow:0 4px 14px rgba(80,60,120,.08);transition:transform .15s}
a.item:active{transform:scale(.98)}
a.item.hit{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.n{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--num);color:var(--numink);font:400 26px/1 Jua,sans-serif}
.th{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#fff}
.nm{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:3px;white-space:nowrap;font-size:15px}.pr b{font:400 18px Jua,sans-serif}.pr s{color:var(--dim);font-size:13px;margin-left:4px}.pr em{font-style:normal;color:var(--accent);font-weight:700;margin-right:4px}
.go{color:var(--dim);font-size:20px}
.empty{color:var(--dim);text-align:center;padding:20px}
footer{margin-top:22px;font-size:13px;color:var(--dim);text-align:center}
@media(max-width:380px){a.item{grid-template-columns:44px 52px minmax(0,1fr) 14px;gap:9px}.n{width:44px;height:44px;font-size:22px}.th{width:52px;height:52px}}
@media(prefers-reduced-motion:reduce){a.item{transition:none}}
</style></head><body><main>
